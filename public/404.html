<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Jagmohan Singh — Portfolio</title>
    <script>
      // GitHub Pages SPA redirect trick (rafgraph/spa-github-pages)
      // Captures any 404 URL, encodes the path as a query param,
      // and redirects to the app root so React Router can handle it.
      var segmentCount = 1;
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.split('/').slice(1 + segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
